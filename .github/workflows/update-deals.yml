name: Refresh public deals
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_deals.py
      - name: Publish refreshed deals
        run: |
          git config user.name "dealora-bot"
          git config user.email "actions@users.noreply.github.com"
          git add deals.json
          git diff --cached --quiet || git commit -m "Refresh public deals"
          git push
